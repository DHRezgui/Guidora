# Full-stack dev (postgres + Nest backend + Next dashboard), same layout as TrustDev .docker/develop compose files.
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-onboarding}
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password123}
    ports:
      - '${DB_PORT:-5543}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-admin} -d ${DB_NAME:-onboarding}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trustdev-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: .docker/develop/Dockerfile
    env_file: ./backend/.docker/develop/.env
    ports:
      - '${BACKEND_HOST_PORT:-3020}:3000'
    environment:
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_USER: ${DB_USER:-admin}
      DB_PASSWORD: ${DB_PASSWORD:-password123}
      DB_NAME: ${DB_NAME:-onboarding}
      NODE_ENV: ${NODE_ENV_B:-development}
      NODE_OPTIONS: --max-old-space-size=1024
      REDIS_ENABLED: 'false'
      RABBITMQ_ENABLED: 'false'
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3021}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@trustdev.com}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - trustdev-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'nc -z localhost 3000 || exit 1']
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s

  dashboard:
    build:
      context: ./dashboard
      dockerfile: .docker/develop/Dockerfile
    env_file: ./dashboard/.docker/develop/.env
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3020/api/v1}
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://backend:3000/api/v1}
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: '1'
    ports:
      - '${DASHBOARD_HOST_PORT:-3021}:3000'
    depends_on:
      - backend
    volumes:
      - ./dashboard:/app
      - ./sdks/react:/sdks/react
      - /app/node_modules
      - /app/.next
    command: npm run dev
    networks:
      - trustdev-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  trustdev-network:
    driver: bridge
