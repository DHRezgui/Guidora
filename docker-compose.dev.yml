# Full-stack dev (postgres + Nest backend + Next dashboard), same layout as TrustDev .docker/develop compose files.
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-onboarding}
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password123}
    ports:
      - '${DB_PORT:-5543}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-admin} -d ${DB_NAME:-onboarding}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trustdev-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trustdev-network
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - '${RABBITMQ_PORT:-5672}:5672'
      - '${RABBITMQ_MANAGEMENT_PORT:-15672}:15672'
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD-SHELL', 'rabbitmq-diagnostics -q ping || exit 1']
      interval: 30s
      timeout: 30s
      retries: 10
      start_period: 120s
    networks:
      - trustdev-network
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:7
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@trustdev.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
    ports:
      - '${PGADMIN_PORT:-5050}:80'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - trustdev-network
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/.docker/develop/Dockerfile
    env_file: ./backend/.docker/develop/.env
    ports:
      - '${BACKEND_HOST_PORT:-3020}:3000'
    environment:
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_USER: ${DB_USER:-admin}
      DB_PASSWORD: ${DB_PASSWORD:-password123}
      DB_NAME: ${DB_NAME:-onboarding}
      NODE_ENV: ${NODE_ENV_B:-development}
      NODE_OPTIONS: --max-old-space-size=1024
      REDIS_ENABLED: 'true'
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      RABBITMQ_ENABLED: 'true'
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: '5672'
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      PYTHON_EXECUTABLE: python3
      SEMANTIC_SCRIPT_PATH: /app/ml/rag/semantic_search.py
      ML_ABANDONMENT_WORKER_SCRIPT_PATH: /app/ml/abandonment_worker.py
      ML_ABANDONMENT_AUTO_WARMUP: 'true'
      ML_ABANDONMENT_WORKER_STARTUP_TIMEOUT_MS: '60000'
      ML_ABANDONMENT_WORKER_REQUEST_TIMEOUT_MS: '5000'
      FAQ_PYTHON_TIMEOUT_MS: ${FAQ_PYTHON_TIMEOUT_MS:-600000}
      FAQ_ORG_STORAGE_DIR: /app/data/faq-orgs
      FAQ_ADAPTIVE_THRESHOLDS: ${FAQ_ADAPTIVE_THRESHOLDS:-0.7,0.65,0.6}
      FAQ_LEXICAL_BOOST: ${FAQ_LEXICAL_BOOST:-true}
      FAQ_FALLBACK_MIN_SCORE: ${FAQ_FALLBACK_MIN_SCORE:-0.55}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3021}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./ml:/app/ml
      - /app/node_modules
    networks:
      - trustdev-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'nc -z localhost 3000 || exit 1']
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s

  dashboard:
    build:
      context: ./dashboard
      dockerfile: .docker/develop/Dockerfile
    env_file: ./dashboard/.docker/develop/.env
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3020/api/v1}
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://backend:3000/api/v1}
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: '1'
      # Bind mount Windows/Docker : le watcher natif rate les sous-dossiers app/**/*
      WATCHPACK_POLLING: 'true'
      CHOKIDAR_USEPOLLING: 'true'
      WATCHPACK_POLLING_INTERVAL: '500'
    ports:
      - '${DASHBOARD_HOST_PORT:-3021}:3000'
    depends_on:
      - backend
    volumes:
      - ./dashboard:/app
      - ./sdks/react:/sdks/react
      # SDK visible sous /app/sdks pour que Turbopack (root=/app) résolve @sdk et les imports relatifs.
      - ./sdks/react:/app/sdks/react
      - /app/node_modules
      # Cache Turbopack sur FS Linux natif (évite corruption routes.d.ts sur bind mount Windows/VirtioFS).
      # dev:clean efface .next à chaque démarrage conteneur ; le garde-fou le régénère si corruption en cours de session.
      - dashboard_next_cache:/app/.next
    command: npm run dev:clean
    healthcheck:
      test: ['CMD', 'node', 'scripts/healthcheck-create-route.mjs']
      interval: 20s
      timeout: 50s
      retries: 10
      start_period: 120s
    networks:
      - trustdev-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  pgadmin_data:
  dashboard_next_cache:

networks:
  trustdev-network:
    driver: bridge
